name: pomniter_mobile
description: "Pomniter - AI-powered screenshot memory search engine"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0
  # ObjectBox native binaries (HNSW vector index support)
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  # HTTP for model downloads
  http: ^1.2.2
  path_provider: ^2.1.4
  path: ^1.9.1
  crypto: ^3.0.5
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2

  pomniter_design_system:
    path: ../../packages/design-system
  pomniter_shared_models:
    path: ../../packages/shared-models
  pomniter_core_engine:
    path: ../../packages/core-engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
